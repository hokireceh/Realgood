# fly.toml app configuration file generated for realgood on 2026-11-16T08:38:15Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'realgood'
primary_region = 'iad'

[env]
  KURIER_API_URL = "https://api.kurier.xyz/api/v1"
  KURIER_VK_REGISTERED = "true"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  # 1 mesin hangat terus (diputuskan 2026-11-16 ~15:30 WIB): cold-start
  # self-test 15-30 dtk bisa memakan deadline 60 dtk saat task datang.
  # Biaya: 1 mesin 512MB jalan 24/7 kira-kira $4,38/bln, masih di bawah
  # ambang gratis $5 -> tagihan tetap $0.
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
  processes = ['app']
  size = 'shared-cpu-1x'
